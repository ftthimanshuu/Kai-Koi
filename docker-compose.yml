services:
  postgres:
    image: postgres:15-alpine
    container_name: kaikoi-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaikoi_db}
      POSTGRES_USER: ${POSTGRES_USER:-kaikoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaikoisecret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaikoi -d kaikoi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kaikoi-redis
    restart: always
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
