# ==========================================
# Kai Koi — Backend Configuration
# ==========================================

spring.application.name=kaikoi-backend
server.port=8080

# ── Database (PostgreSQL) ─────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kaikoi_db}
spring.datasource.username=${DATABASE_USERNAME:kaikoi}
spring.datasource.password=${DATABASE_PASSWORD:kaikoisecret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA & Hibernate ───────────────────────
# Flyway manages schema — Hibernate must not touch DDL directly
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway Migrations ─────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Redis ─────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── Booking Configuration ─────────────────
booking.hold.duration.minutes=${BOOKING_HOLD_DURATION_MINUTES:10}

# ── CORS Settings ─────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
