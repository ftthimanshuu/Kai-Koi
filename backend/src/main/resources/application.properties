# ==========================================
# Kai Koi — Backend Configuration
# ==========================================

spring.application.name=kaikoi-backend
server.port=8080

# ── Database (Supabase PostgreSQL / Local) ───────────────
# For Supabase, use: jdbc:postgresql://db.<PROJECT_REF>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kaikoi_db}
spring.datasource.username=${DATABASE_USERNAME:kaikoi}
spring.datasource.password=${DATABASE_PASSWORD:kaikoisecret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA & Hibernate ──────────────────────────────────────
# Flyway manages schema — Hibernate must not touch DDL directly
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway Migrations ────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Redis (Seat Holds & Distributed Locking) ─────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── Supabase Authentication (JWT) ────────────────────────
supabase.project.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

# ── Razorpay Payment Gateway ─────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret_placeholder}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}

# ── Booking Configuration ────────────────────────────────
booking.hold.duration.minutes=${BOOKING_HOLD_DURATION_MINUTES:10}

# ── CORS Settings ────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
